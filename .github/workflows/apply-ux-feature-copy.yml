name: Apply UX feature copy update

on:
  push:
    branches: [update-ux-features-from-arise]

permissions:
  contents: write

jobs:
  patch-site-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update website feature copy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/main.jsx';
          let content = fs.readFileSync(path, 'utf8');

          content = content.replace(
            "A beautifully animated alarm clock with custom themes, gradual volume fade-in, lock-screen support, and fully offline operation.",
            "A beautifully animated alarm clock with custom themes, swipe-friendly navigation, expanded language support, gradual volume fade-in, lock-screen support, and fully offline operation."
          );

          content = content.replace(
            "          <SummaryCard iconName=\"palette\" title=\"Personal design\" text=\"Preset themes, custom themes, flexible time format, and animated backgrounds.\" />",
            "          <SummaryCard iconName=\"palette\" title=\"Personal design\" text=\"Preset themes, editable custom themes, fine visual controls, and animated backgrounds.\" />\n          <SummaryCard iconName=\"globe\" title=\"Localized experience\" text=\"Expanded language support with an in-app language selector.\" />"
          );

          content = content.replace(
            "      ['Swipe up to stop', 'Protection against accidentally dismissing the alarm.', 'shield', 'free'],",
            "      ['Swipe up to stop', 'Protection against accidentally dismissing the alarm.', 'shield', 'free'],\n      ['Circular snooze screen', 'A large glass-style snooze control with animated swipe-up guidance.', 'hand', 'free'],"
          );

          content = content.replace(
            "      ['Precise stopwatch', 'Stopwatch with milliseconds for exact measurements.', 'stopwatch', 'free'],",
            "      ['Precise stopwatch', 'Stopwatch with milliseconds for exact measurements.', 'stopwatch', 'free'],\n      ['Swipe-friendly navigation', 'Move naturally between main screens without interfering with vertical scrolling.', 'hand', 'free'],"
          );

          content = content.replace(
            "      ['Custom themes', 'Create your own theme with the color palette.', 'sparkles', 'premium'],\n      ['Flexible time format', 'Choose between 12-hour or 24-hour time format.', 'calendar', 'free'],",
            "      ['Editable custom themes', 'Create, reopen, and refine your own visual themes.', 'sparkles', 'premium'],\n      ['3-zone colour editor', 'Drag colour zones directly on the preview to shape the background.', 'palette', 'premium'],\n      ['Fine visual tuning', 'Adjust brightness, tone, colour purity, and orb behaviour for custom themes.', 'settings', 'premium'],\n      ['Flexible time format', 'Choose between 12-hour or 24-hour time format.', 'calendar', 'free'],"
          );

          content = content.replace(
            "      ['Settings shortcuts', 'Quick access to Android settings for alarm-related permissions.', 'settings', 'free'],\n      ['Boot persistence', 'Enabled alarms are rescheduled after the device restarts.', 'rotate', 'free'],",
            "      ['Settings shortcuts', 'Quick access to Android settings for alarm-related permissions.', 'settings', 'free'],\n      ['Safer alarm deletion', 'Alarm deletion uses confirmation instead of accidental swipe removal.', 'shield', 'free'],\n      ['Boot persistence', 'Enabled alarms are rescheduled after the device restarts.', 'rotate', 'free'],"
          );

          const languageGroup = `\n  {\n    group: 'Language & navigation',\n    items: [\n      ['In-app language selector', 'Choose the app language from Settings without changing the whole phone.', 'globe', 'free'],\n      ['Expanded localization', 'Language support has been expanded beyond English and Romanian for a broader international release.', 'fileText', 'free'],\n      ['Directional swipe transitions', 'Screen transitions follow the direction of your swipe for a more natural feel.', 'chevronRight', 'free'],\n    ],\n  },`;

          if (!content.includes("group: 'Language & navigation'")) {
            content = content.replace(
              "  {\n    group: 'Reliability',",
              languageGroup + "\n  {\n    group: 'Reliability',"
            );
          }

          content = content.replace(
            "  ['Can I create custom themes?', 'Yes. Arise includes preset themes and a custom theme creator. Some advanced customization features may later become available as premium features.'],",
            "  ['Can I create custom themes?', 'Yes. Arise includes preset themes, editable custom themes, a 3-zone colour editor, and fine tuning controls for brightness, tone, colour purity, and background orb behaviour. Some advanced customization features may later become available as premium features.'],"
          );

          if (!content.includes("Which languages does Arise support?")) {
            content = content.replace(
              "  ['What time formats are available?', 'Arise supports both 12-hour and 24-hour time formats.'],",
              "  ['What time formats are available?', 'Arise supports both 12-hour and 24-hour time formats.'],\n  ['Which languages does Arise support?', 'Arise includes an in-app language selector and expanded localization for a broader international release.'],"
            );
          }

          fs.writeFileSync(path, content);
          fs.rmSync('.github/workflows/apply-ux-feature-copy.yml', { force: true });
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx .github/workflows/apply-ux-feature-copy.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update website UX feature copy from Arise commits"
            git push
          fi
